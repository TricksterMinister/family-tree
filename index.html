<!doctype html>
<html lang="ka">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1015" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="საგვარეულო ატლასი" />
    <title>თეიმურაზ ბენიძის საგვარეულო ატლასი</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Noto+Serif+Georgian:wght@400;500;600&family=Noto+Sans+Georgian:wght@400;500&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="atlas.css?v=apex1" />
    <script defer src="atlas-data.js?v=apex1"></script>
    <script defer src="atlas.js?v=apex1"></script>
  </head>
  <body class="loading" data-edition="temo">
    <div class="scenery" aria-hidden="true"></div>
    <div class="ambient" aria-hidden="true"></div>
    <header id="masthead">
      <p id="edition"></p>
      <h1 data-t="title"></h1>
      <div class="header-rule" aria-hidden="true"></div>
    </header>
    <main id="viewport" data-label="canvas">
      <div id="world"><svg id="edges" aria-hidden="true"></svg></div>
    </main>
    <p id="status" role="status" data-t="loading">ატლასი იტვირთება</p>
    <button id="skip-intro" data-t="skip" hidden></button>
    <p id="hint" data-t="hint"></p>
    <nav class="dock" data-label="canvas">
      <button id="nav-home">
        <span aria-hidden="true">⌂</span><span data-t="home"></span>
      </button>
      <button id="nav-ancestors">
        <span aria-hidden="true">♧</span><span data-t="ancestors"></span>
      </button>
      <button id="nav-overview">
        <span aria-hidden="true">⊞</span><span data-t="overview"></span>
      </button>
      <button id="nav-menu" aria-haspopup="dialog" aria-controls="menu">
        <span aria-hidden="true">⚙</span><span data-t="menu"></span>
      </button>
    </nav>
    <div class="zoom">
      <button id="zoom-out" data-label="zoomOut">−</button
      ><output id="zoom-value"></output
      ><button id="zoom-in" data-label="zoomIn">+</button>
    </div>
    <dialog id="menu" aria-labelledby="menu-title">
      <header class="dialog-head">
        <h2 id="menu-title" data-t="menu"></h2>
        <button id="menu-close" class="close" data-label="close">×</button>
      </header>
      <label for="language" data-t="language"></label
      ><select id="language"></select>
      <label for="lighting" data-t="light"></label
      ><select id="lighting"></select>
      <button id="replay" class="menu-action" data-t="replay"></button>
      <a id="edition-link" class="menu-action" href="irakli.html"></a>
    </dialog>
    <dialog id="drawer" aria-labelledby="d-name">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="sheet-controls">
        <button id="sheet-size" data-t="expand"></button
        ><button id="sheet-close" class="close" data-label="close">×</button>
      </div>
      <div class="sheet-scroll">
        <p id="d-role"></p>
        <h2 id="d-name"></h2>
        <p id="d-date"></p>
        <hr />
        <h3 data-t="biography"></h3>
        <div id="d-rows"></div>
        <div id="d-kin"></div>
      </div>
    </dialog>
    <noscript
      ><p class="no-script">
        გთხოვთ, ჩართოთ ბრაუზერში სცენარების შესრულება.
      </p></noscript
    >
  </body>
</html>
