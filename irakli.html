<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ირაკლი ვაჟას ძე ბენიძის საგვარეულო ხე</title>
  <meta name="theme-color" content="#0a0c0f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Noto+Serif+Georgian:wght@300;400;500;600&family=Noto+Sans+Georgian:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="atlas.css?v=25">
</head>
<body>
  <div id="curtain">
    <div class="in">
      <div class="c-eyebrow" data-t="eyebrow"></div>
      <div class="c-rule"></div>
      <h2 data-t="title"></h2>
      <div class="c-sub" data-t="houses"></div>
    </div>
  </div>

  <main id="viewport" aria-label="Family tree canvas">
    <div id="sukhumi-bg" aria-hidden="true">
      <div class="sk-layer sk-base"></div>
      <div class="sk-layer sk-wave"></div>
      <div class="sk-layer sk-glint"></div>
    </div>
    <div id="world"><svg id="edges" aria-hidden="true"></svg></div>
  </main>
  <div class="vignette"></div>
  <div class="grain"></div>

  <header id="masthead" class="chrome">
    <div class="eyebrow" data-t="eyebrow"></div>
    <h1 data-t="title"></h1>
    <div class="houses" data-t="houses"></div>
  </header>

  <div id="rail" class="chrome"></div>

  <nav id="toolbar" class="chrome">
    <div class="pill gift-badge"><span class="badge-icon">✦</span> <span class="long" data-t="giftBadge">13 ნოემბერი · საჩუქარი</span></div>
    <span class="tb-sep" aria-hidden="true"></span>
    <div id="light-switcher" class="seg" role="group" aria-label="Свет гравюры">
      <button data-light="sunset" class="on" title="1. Закатный луч">☀️ Закат</button>
      <button data-light="opal" title="2. Опал">💎 Опал</button>
      <button data-light="promenade" title="3. Огни">🏮 Огни</button>
    </div>
    <span class="tb-sep" aria-hidden="true"></span>
    <button id="btn-direct" class="pill"><span class="dot"></span><span class="txt" data-t="direct"></span></button>
    <span class="tb-sep" aria-hidden="true"></span>
    <div id="lang" class="seg" role="group" aria-label="Language">
      <button data-lang="ka">KA</button><button data-lang="en">EN</button><button data-lang="ru">RU</button>
    </div>
  </nav>

  <div id="legend" class="chrome">
    <div><i style="background:var(--c-main)"></i><span data-t="lgMain"></span></div>
    <div><i style="background:var(--c-paternal)"></i><span data-t="lgPat"></span></div>
    <div><i style="background:var(--c-kalandia)"></i><span data-t="lgKal"></span></div>
    <div><i style="background:var(--c-lukava)"></i><span data-t="lgLuk"></span></div>
    <div class="shapes"><em data-t="male"></em><em class="fe" data-t="female"></em></div>
  </div>

  <div id="hint" class="chrome" data-t="hint"></div>

  <div id="zoom" class="chrome glass">
    <button id="z-out" aria-label="Zoom out"><svg viewBox="0 0 16 16"><path d="M3 8h10"/></svg></button>
    <output>100%</output>
    <button id="z-in" aria-label="Zoom in"><svg viewBox="0 0 16 16"><path d="M3 8h10M8 3v10"/></svg></button>
    <button id="z-home" aria-label="Back to top"><svg viewBox="0 0 16 16"><path d="M2.5 7.5 8 3l5.5 4.5M4 6.5V13h8V6.5"/></svg></button>
    <button id="z-fit" aria-label="Whole tree"><svg viewBox="0 0 16 16"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"/></svg></button>
  </div>

  <aside id="drawer" aria-live="polite">
    <button class="close" aria-label="Close"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2 2l10 10M12 2 2 12"/></svg></button>
    <div class="scroll" lang="ka"></div>
  </aside>

  <script>window.ATLAS_VARIANT = 'irakli';</script>
  <script src="atlas-data.js?v=25"></script>
  <script src="atlas.js?v=25"></script>
</body>
</html>
